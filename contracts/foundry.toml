[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "../.bin/solc"
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[profile.ci]
solc = ""
solc_version = "0.8.25"
